name: PROD CI
on:
  push:
    branches:
      - main
  # Manual run: rebuilds and redeploys everything, regardless of what changed.
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: [self-hosted, gazmatek]
    outputs:
      backend-changed: ${{ steps.detect-backend.outputs.changed }}
      frontend-changed: ${{ steps.detect-frontend.outputs.changed }}
      docker-changed: ${{ steps.detect-docker.outputs.changed }}
      og-changed: ${{ steps.detect-og.outputs.changed }}
    steps:
      - uses: actions/checkout@v3
        with:
          # Full history: the diff base can be several commits back when a
          # push carries more than one commit.
          fetch-depth: 0

      - name: Resolve diff base
        id: diff-base
        run: |
          # A push can contain several commits, so the deploy has to look at
          # the whole pushed range. Diffing HEAD~1 only sees the last commit:
          # a frontend commit followed by a backend-only commit reported the
          # frontend as unchanged and skipped its deploy entirely, leaving the
          # pushed frontend changes off production.
          #
          # "all" means "build everything" — used for manual runs, the first
          # commit of a branch, and any case where the base is unavailable
          # (force-push, deleted history) so we redeploy rather than skip.
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "base=all" >> $GITHUB_OUTPUT
          elif [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "base=all" >> $GITHUB_OUTPUT
          elif ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "base=all" >> $GITHUB_OUTPUT
          else
            echo "base=$before" >> $GITHUB_OUTPUT
          fi

      - name: Show changed files
        run: |
          if [ "${{ steps.diff-base.outputs.base }}" = "all" ]; then
            echo "Building everything (no usable diff base)."
          else
            git diff --name-only ${{ steps.diff-base.outputs.base }} ${{ github.sha }}
          fi

      - name: Detect backend changes
        id: detect-backend
        run: |
          if [ "${{ steps.diff-base.outputs.base }}" = "all" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only ${{ steps.diff-base.outputs.base }} ${{ github.sha }} | grep '^backend/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect frontend changes
        id: detect-frontend
        run: |
          if [ "${{ steps.diff-base.outputs.base }}" = "all" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only ${{ steps.diff-base.outputs.base }} ${{ github.sha }} | grep '^frontend/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect docker changes
        id: detect-docker
        run: |
          if [ "${{ steps.diff-base.outputs.base }}" = "all" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only ${{ steps.diff-base.outputs.base }} ${{ github.sha }} | grep '^docker/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect OG content changes
        id: detect-og
        run: |
          if [ "${{ steps.diff-base.outputs.base }}" = "all" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only ${{ steps.diff-base.outputs.base }} ${{ github.sha }} | grep -E '^frontend/src/content/(artists|events)\.ts$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build-backend:
    runs-on: [self-hosted, gazmatek]
    needs: check-changes
    if: |
      needs.check-changes.outputs.backend-changed == 'true' ||
      needs.check-changes.outputs.docker-changed == 'true' ||
      needs.check-changes.outputs.og-changed == 'true'
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install backend dependencies
        working-directory: backend
        run: npm i

      - name: Build backend
        working-directory: backend
        run: CI= npm run build

      - name: Copy Docker to Backend
        run: cp -R docker backend/dist

      - name: Move Node modules to backend dist
        run: |
          mv backend/node_modules backend/dist/node_modules

      - name: Move backend build to shared directory
        run: |
          mkdir -p /tmp/shared/PROD/${{ github.event.repository.name }}/backend-build
          cp -R backend/dist/* /tmp/shared/PROD/${{ github.event.repository.name }}/backend-build

  build-frontend:
    runs-on: [self-hosted, gazmatek]
    needs: check-changes
    if: |
      needs.check-changes.outputs.frontend-changed == 'true' ||
      needs.check-changes.outputs.docker-changed == 'true'
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: CI= npm run build

      - name: Move frontend build to shared directory
        run: |
          mkdir -p /tmp/shared/PROD/${{ github.event.repository.name }}/frontend-build
          # "dir/." and not "dir/*": the glob skips dotfiles, which silently
          # dropped build/.vite/manifest.json. botMiddleware needs that manifest
          # to resolve artist/event images to their hashed filenames, so without
          # it every social share fell back to the generic thumbnail.
          cp -R frontend/build/. /tmp/shared/PROD/${{ github.event.repository.name }}/frontend-build

  deploy-backend:
    runs-on: [self-hosted, gazmatek]
    needs: build-backend
    if: needs.build-backend.result == 'success'
    steps:
      - uses: actions/checkout@v3

      - name: Create directory for downloaded artifact
        run: mkdir -p backend-build

      - name: Copy backend build from shared directory
        run: |
          REPO_PATH="$HOME/PROD-${{ github.event.repository.name }}"
          mkdir -p "$REPO_PATH"
          cp -R /tmp/shared/PROD/${{ github.event.repository.name }}/backend-build/* "$REPO_PATH"

      - name: Restart Docker containers
        run: |
          REPO_PATH="$HOME/PROD-${{ github.event.repository.name }}"
          cd "$REPO_PATH/docker"
          docker-compose -f docker-compose.prod.yml down
          docker-compose -f docker-compose.prod.yml up -d

  deploy-frontend:
    runs-on: [self-hosted, gazmatek]
    needs: build-frontend
    if: needs.build-frontend.result == 'success'
    steps:
      - uses: actions/checkout@v3

      - name: Create directory for downloaded artifact
        run: mkdir -p frontend-build

      - name: Create build directory in PROD
        run: |
          REPO_PATH="$HOME/PROD-${{ github.event.repository.name }}"
          mkdir -p "$REPO_PATH/build"

      - name: Copy frontend build from shared directory
        run: |
          REPO_PATH="$HOME/PROD-${{ github.event.repository.name }}"
          # "dir/." so .vite/manifest.json is carried over (see build-frontend)
          cp -R /tmp/shared/PROD/${{ github.event.repository.name }}/frontend-build/. "$REPO_PATH/build"

  cleanup:
    runs-on: [self-hosted, gazmatek]
    needs:
      - deploy-backend
      - deploy-frontend
    if: always()
    steps:
      - name: Cleanup shared directory
        run: |
          echo "Cleaning up shared directory..."
          rm -rf /tmp/shared/PROD/${{ github.event.repository.name }}/*
          echo "Cleanup complete."
